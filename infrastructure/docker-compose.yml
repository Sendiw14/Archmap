# Local development / smoke-test stack. Credentials here are development-only placeholders.
name: archmap

x-app-env: &app-env
  ARCHMAP_MODE: production
  DATABASE_URL: postgres://archmap:archmap-dev@postgres:5432/archmap
  REDIS_URL: redis://redis:6379/0
  S3_BUCKET: archmap-artifacts
  S3_ENDPOINT: http://s3:8333
  S3_REGION: us-east-1
  S3_ACCESS_KEY_ID: archmap-dev
  S3_SECRET_ACCESS_KEY: archmap-dev-secret-change-me
  S3_CREATE_BUCKET: "true"
  CLIENT_KEY_SECRET: dev-only-client-key-secret-0123456789abcdef
  ARCHMAP_SOURCE: ${ARCHMAP_SOURCE:-github}
  WEB_ORIGINS: ${WEB_ORIGINS:-http://localhost:3000}
  SECURE_COOKIES: "false"
  IMPORTS_ENABLED: ${IMPORTS_ENABLED:-true}

x-hardened: &hardened
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped

services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: archmap
      POSTGRES_PASSWORD: archmap-dev
      POSTGRES_DB: archmap
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["127.0.0.1:${ARCHMAP_PG_PORT:-55432}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U archmap"]
      interval: 2s
      retries: 30

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports: ["127.0.0.1:${ARCHMAP_REDIS_PORT:-56379}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 30

  s3:
    image: chrislusf/seaweedfs:3.97
    command:
      [
        "server",
        "-dir=/data",
        "-s3",
        "-s3.port=8333",
        "-s3.config=/etc/archmap/s3.json",
        "-volume.max=4",
      ]
    volumes:
      - s3data:/data
      - ./seaweedfs-s3.json:/etc/archmap/s3.json:ro
    ports: ["127.0.0.1:${ARCHMAP_S3_PORT:-58333}:8333"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:8333/status >/dev/null 2>&1 || wget -qS http://127.0.0.1:8333/ 2>&1 | grep -q 'HTTP/'",
        ]
      interval: 3s
      retries: 40

  api:
    <<: *hardened
    build: { context: .., dockerfile: infrastructure/Dockerfile }
    environment:
      <<: *app-env
      TRUST_PROXY: "1"
    ports: ["127.0.0.1:${ARCHMAP_API_PORT:-4100}:4000"]
    tmpfs: ["/tmp:size=64m"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      s3: { condition: service_healthy }
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/health/ready').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))",
        ]
      interval: 5s
      retries: 20

  worker:
    <<: *hardened
    build: { context: .., dockerfile: infrastructure/Dockerfile }
    command: ["node", "apps/worker/src/main.ts"]
    environment:
      <<: *app-env
      WORK_DIR: /work
    # Scratch space for one job at a time per slot; extracted source never touches the image FS.
    tmpfs: ["/work:size=512m,mode=1777", "/tmp:size=64m"]
    mem_limit: 2560m
    cpus: 2
    pids_limit: 256
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      s3: { condition: service_healthy }

volumes:
  pgdata:
  s3data:
